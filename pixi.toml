[workspace]
channels = ["pytorch", "nvidia", "conda-forge"]
channel-priority = "disabled"
name = "advanced_robotic_systems"
platforms = ["win-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.8"

[tasks]
app = "python app_v4.py"

[dependencies]
python          = "3.12.*"
pip             = ">=26.0.1,<27"
pytorch-gpu     = ">=2.7,<3"
torchvision     = ">=0.22,<1"
cuda-version    = "12.8.*"
pillow          = ">=11.3.0,<13"
setuptools      = "<80"
numpy           = "*"
matplotlib      = "*"
huggingface_hub = ">=1.5.0,<2"
iopath          = ">=0.1.10,<0.2"
einops          = ">=0.8.2,<0.9"
pycocotools     = ">=2.0.11,<3"
psutil          = ">=7.2.2,<8"
ftfy            = ">=6.3.1,<7"
sam3            = ">=0.1.0.20251211,<0.2"
sentencepiece   = ">=0.2.1,<0.3"
imageio         = ">=2.37.0,<3"
py-opencv       = "*"
gradio          = ">=5.0,<7"
accelerate      = ">=1.13.0,<2"
peft            = ">=0.18.1,<0.19"
transformers    = "*"
ffmpeg          = ">=7.0,<8"
pytz = ">=2026.1.post1,<2027"
scikit-image = ">=0.26.0,<0.27"
scikit-learn = ">=1.8.0,<2"

[pypi-dependencies]
# decord — no win-64 conda build exists
#decord  = ">=0.6.0,<0.7"
# kernels + spaces — HF-specific, pypi only
#kernels = ">=0.12.2,<0.13"
#spaces  = ">=0.26.0,<0.27"
# pyav for imageio video backend
#imageio = { version = "*", extras = ["pyav"] }
# if you need gradio mcp extra, comment out gradio above and uncomment this:
# gradio = { version = ">=6.8.0,<7", extras = ["mcp"] }
