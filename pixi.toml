[workspace]
channels = ["pytorch", "nvidia", "conda-forge"]
channel-priority = "disabled"
name = "advanced_robotic_systems"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.8"

[tasks]

[dependencies]
python = "3.12.*"
pip = ">=26.0.1,<27"
pytorch-gpu = ">=2.7,<3"
torchvision = ">=0.22,<1"
