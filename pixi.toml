pillow = ">=11.3.0,<13"
setuptools = "<80"
huggingface_hub = ">=1.5.0,<2"
iopath = ">=0.1.10,<0.2"
einops = ">=0.8.2,<0.9"
pycocotools = ">=2.0.11,<3"
psutil = ">=7.2.2,<8"
ftfy = ">=6.3.1,<7"
sam3 = ">=0.1.0.20251211,<0.2"

[pypi-dependencies]
decord = ">=0.6.0, <0.7"
